spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Gestion_equipos_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

jwt.secret-key=${JWT_SECRET:test-jwt-secret-key-12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=false

app.admin.email=admin@admin.com
app.admin.password=123456